version: '3'
services: 
  rabbit:
    container_name: mq-container
    hostname: rabbit
    image: rabbitmq:latest
    environment: 
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=12345678
    ports: 
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./mq/data:/var/lib/rabbitmq/mnesia/
  
  postgres:
    container_name: postgres
    hostname: postgres
    image: postgres:11
    environment:
      - POSTGRES_PASSWORD=12345678
    ports:
      - '15432:5432'
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -h localhost -p 5432 -q -U postgres"
      interval: 3s
      timeout: 1s
      retries: 10
  
  torproxy:
    container_name: torproxy
    hostname: torproxy
    image: dperson/torproxy
    ports: 
      - '8118:8118'
      - '9050:9050'

  worker-project:
    container_name: worker-project-container
    build: 
      context: .
      dockerfile: Dockerfile
    image: &app app
    volumes: 
      - ./crawler:/app
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
  
  worker-source:
    image: *app
    container_name: worker-source-container
    volumes: 
      - ./crawler:/app
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy

  flower:
    image: zoomeranalytics/flower:0.9.1-4.0.2
    restart: "no"
    env_file: *envfile
    ports:
      - "5555:5555"
    depends_on:
      - rabbit