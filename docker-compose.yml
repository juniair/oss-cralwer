version: "3"
services:
  rabbit:
    container_name: mq-container
    hostname: rabbit
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=12345678
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./mq/data:/var/lib/rabbitmq/mnesia

  torproxy:
    container_name: torproxy
    hostname: torproxy
    image: dperson/torproxy
    ports:
      - "8118:8118"
      - "9050:9050"

  crawler:
    container_name: crawler-container
    build:
      context: .
      dockerfile: Crawler_Dockerfile
    image: &app app
    stdin_open: true
    tty: true
    volumes:
      - ./crawler:/app
      - ./data:/HDD2/alice_project/alice_crawler/data
    network_mode: "host"

  clare-batch:
    container_name: clare-batch-container
    build:
      context: .
      dockerfile: Batch_Dockerfile
    image: &clare-batch clare-batch
    stdin_open: true
    tty: true
    volumes:
      - ./batch:/app
      - ./data:/HDD2/alice_project/alice_crawler/data
      - ./codebase:/HDD2/alice_project/alice_crawler/codebase
    network_mode: "host"

  flower:
    container_name: flower-container
    image: zoomeranalytics/flower:0.9.1-4.0.2
    restart: "no"
    ports:
      - "5555:5555"
    depends_on:
      - rabbit
    environment:
      - CELERY_BROKER_URL=amqp://admin:12345678@rabbit
      - FLOWER_PORT=5555
